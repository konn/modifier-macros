[plugins."haskell-haddock-skill@konn-haskell-claude-tools"]
enabled = true

[plugins."haskell-format-skill@konn-haskell-claude-tools"]
enabled = true

[plugins."haskell-cabal-gild-skill@konn-haskell-claude-tools"]
